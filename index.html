<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Activity Visualizer</title>
  <link rel="icon" type="image/png" href="/github-visualizer/assets/favicon-32x32-BWUDnyVG.png" />
  <script type="module" crossorigin src="/github-visualizer/assets/index-SDBfNc-l.js"></script>
  <link rel="stylesheet" crossorigin href="/github-visualizer/assets/index-CY49tPRM.css">
</head>
<body>
  <div class="app">

    <!-- Embed view (shown only when ?embed=1) -->
    <div id="embed-view" style="display:none"></div>

    <!-- Header -->
    <header class="header">
      <span class="header-logo">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub Visualizer
      </span>

      <nav class="tabs" role="tablist">
        <button class="tab tab--active" id="tab-profile" role="tab" aria-selected="true">
          Profile
        </button>
        <button class="tab" id="tab-compare" role="tab" aria-selected="false">
          Compare
        </button>
      </nav>

      <button id="embed-btn" class="theme-toggle" style="display:none" aria-label="Copy embed code" title="Copy embed code">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </button>

      <button id="export-btn" class="theme-toggle" style="display:none" aria-label="Export dashboard as PNG" title="Export as PNG">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>

      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <div id="rate-limit-badge" class="rate-limit-badge" style="display:none" aria-label="GitHub API rate limit">
        <span id="rate-limit-dot" class="rate-limit-dot"></span>
        <span id="rate-limit-text"></span>
      </div>
    </header>

    <!-- Profile search -->
    <div id="panel-profile">
      <form id="search-form" class="search-bar">
        <input
          id="username-input" class="search-input"
          type="text"
          placeholder="Enter GitHub username…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-search" type="submit">View profile</button>
      </form>

      <div id="error-box" role="alert"></div>

      <div id="loading" aria-live="polite">
        <div class="spinner"></div>
        <span>Loading profile…</span>
      </div>

      <main id="dashboard">
        <!-- Profile -->
        <div class="profile">
          <img id="avatar" src="" alt="User avatar" />
          <div class="profile-info">
            <p id="profile-name"></p>
            <span id="profile-org-badge" class="org-badge" style="display:none">Organization</span>
            <p id="profile-bio"></p>
            <p id="profile-location">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 018 14.58a31.481 31.481 0 01-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0110 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 002 6c0 4.314 6 10 6 10z"/>
                <path d="M8 8a2 2 0 110-4 2 2 0 010 4z"/>
              </svg>
              <span></span>
            </p>
            <a id="profile-link" href="#" target="_blank" rel="noopener"></a>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Repositories</div>
            <div class="stat-value" id="stat-repos">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total stars</div>
            <div class="stat-value" id="stat-stars">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Followers</div>
            <div class="stat-value" id="stat-followers">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Current streak</div>
            <div class="stat-value" id="stat-streak">—</div>
          </div>
        </div>

        <!-- Activity trend -->
        <div class="card">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
              <polyline points="16 7 22 7 22 13"/>
            </svg>
            Activity trend — last 12 months
          </div>
          <div id="activity-chart-container" style="position:relative"></div>
        </div>

        <!-- Streak graph -->
        <div class="card">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M1.5 1.75V13.5h13.75a.75.75 0 010 1.5H.75a.75.75 0 01-.75-.75V1.75a.75.75 0 011.5 0z"/>
              <path d="M5.5 11.5a.75.75 0 01-.75-.75V9.62a.75.75 0 011.5 0v1.13a.75.75 0 01-.75.75zm2.5 0a.75.75 0 01-.75-.75V7.12a.75.75 0 011.5 0v3.63a.75.75 0 01-.75.75zm2.5 0a.75.75 0 01-.75-.75V4.62a.75.75 0 011.5 0v6.13a.75.75 0 01-.75.75zm2.5 0a.75.75 0 01-.75-.75V2.12a.75.75 0 011.5 0v8.63a.75.75 0 01-.75.75z"/>
            </svg>
            Contribution activity — last 12 months
          </div>
          <div id="streak-container"></div>
        </div>

        <!-- Coding hours heatmap -->
        <div class="card">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0a8 8 0 110 16A8 8 0 018 0zM1.5 8a6.5 6.5 0 1013 0 6.5 6.5 0 00-13 0zm7-3.25v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5a.75.75 0 011.5 0z"/>
            </svg>
            Coding hours
          </div>
          <div id="commit-heatmap-container" style="position:relative;overflow-x:auto"></div>
        </div>

        <!-- Languages + Repos -->
        <div class="two-col">
          <div class="card">
            <div class="card-title">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 010-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/>
              </svg>
              Languages
            </div>
            <div id="lang-container"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.751.751 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
              </svg>
              Top repositories
            </div>
            <div id="repos-container"></div>
          </div>
        </div>

        <!-- Repository health -->
        <div class="card">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm10.28-1.72-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018l1.47 1.47 3.97-3.97a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/>
            </svg>
            Repository health
          </div>
          <div id="health-container"></div>
        </div>

        <!-- Profile README -->
        <div id="readme-card" class="card" style="display:none">
          <div class="card-title">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.003-2.177A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/>
            </svg>
            Profile README
          </div>
          <div id="readme-container" class="profile-readme"></div>
        </div>
      </main>
    </div>

    <!-- Compare panel -->
    <div id="panel-compare" style="display:none">
      <form id="compare-form" class="search-bar search-bar--compare">
        <input
          id="compare-input-a" class="search-input"
          type="text"
          placeholder="First username…"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="compare-divider">vs</span>
        <input
          id="compare-input-b" class="search-input"
          type="text"
          placeholder="Second username…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-search" type="submit">Compare</button>
      </form>

      <div id="compare-error" role="alert" class="error-box"></div>

      <div id="compare-loading" aria-live="polite" style="display:none">
        <div class="spinner"></div>
        <span>Loading profiles…</span>
      </div>

      <div id="compare-result"></div>
    </div>

  </div>

  <div id="copy-toast" class="copy-toast" aria-live="polite"></div>

</body>
</html>
